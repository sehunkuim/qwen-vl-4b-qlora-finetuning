# Qwen3.5-4B — English prompt / English output (same pipeline as Qwen2-VL-2B)
# Usage:
#   CUDA_VISIBLE_DEVICES=0 python scripts/run_baseline_teacher_prompt_4b.py --limit 3
#   CUDA_VISIBLE_DEVICES=0 python scripts/train_sft.py --config config_qwen35_4b.yaml --qlora --run-name sft_4b_qlora_teacher_r16_ep2

ocr_vl_dir: /home/sehun/project/OCR_VL
pdf_dir: /home/sehun/project/sehun/qwen_test/pdf
images_dir: /home/sehun/project/sehun/qwen_test/images
output_dir: /home/sehun/project/sehun/qwen_test/output/qwen35_4b
label_dir: /home/sehun/project/sehun/qwen_test/label
label_ko_dir: /home/sehun/project/sehun/qwen_test/label_ko

dashscope_env_file: /home/sehun/project/OCR_VL/.env
dashscope_base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

label_model: qwen3.5-flash
label_workers: 32
label_max_retries: 3
label_val_ratio: 0.15
label_val_seed: 42

# Baseline + SFT student (bf16; LoRA needs non-FP8 weights)
vl_model_id: Qwen/Qwen3.5-4B
sft_model_id: Qwen/Qwen3.5-4B

# SFT input = same as qwen3.5-flash labeling (NOT vl_prompt)
sft_prompt_style: flash_teacher

vl_backend: vllm
vl_gpu_memory_utilization: 0.45
vl_enforce_eager: true
layout_device: "gpu:0"
vl_cuda_device: "0"
vl_max_model_len: 4096
vl_max_num_seqs: 8
vl_batch_size: 8

dpi: 92

# Student prompt — baseline + SFT input (English in / English out)
vl_prompt: |-
  Caption this lecture-slide figure for an English-language retrieval index.

  Output format:
  - Write exactly 2 short sentences in English.
  - Use English only (no Korean, Chinese, or Japanese). Quote visible labels, axes, and equations as they appear.

  Accuracy:
  - Describe only what is clearly visible in the figure (diagram, chart, photo, or table).
  - Name the figure type and main concept (e.g., SVM margin diagram, CUDA memory hierarchy).
  - Do not invent text, numbers, or slide titles you cannot read.

vl_prompt_ko: |-
  이 강의 슬라이드 그림·도표·사진을 한국어 검색 인덱스용으로 설명하세요.

  출력 형식:
  - 짧은 문장 2개, 한국어로만 작성합니다.
  - 슬라이드에 보이는 라벨·축 이름·수식·코드는 원문 그대로 인용할 수 있습니다.
  - 영어 전용 슬라이드는 필요한 용어만 영어로 두고, 설명 문장은 한국어로 씁니다.

  정확성:
  - 그림에서 분명히 보이는 내용만 서술합니다(도식, 차트, 표, 사진 등).
  - 그림 유형과 핵심 개념을 밝힙니다(예: SVM 마진 도식, CUDA 메모리 계층).
  - 읽을 수 없는 제목·숫자·세부 내용을 지어내지 마세요.

teacher_system: |-
  You write figure captions for academic lecture slides and papers.
  Rules:
  - Output ONLY the caption text. No markdown, no quotes, no preamble.
  - Write 1–2 short sentences in English only (no Korean/Chinese/Japanese in the caption).
  - Be objective and factual: describe visible structure, labels, axes, variables, and relationships.
  - Non-English words on the slide may be quoted in parentheses if essential.
  - Use neutral scholarly tone (as in a paper figure caption), not conversational phrasing.
  - Do NOT start with "This image", "This figure", "This slide", or "The diagram shows".
  - Quote visible text, symbols, and equations exactly when legible.
  - Do NOT invent titles, names, numbers, or details you cannot see.
  - If the crop is a title slide, icon only, or unreadable, state only what is visible.

teacher_system_ko: |-
  강의 슬라이드·논문용 그림 캡션을 한국어로 작성합니다.
  규칙:
  - 캡션 본문만 출력합니다. 마크다운, 따옴표, 서두 없음.
  - 1~2개의 짧은 문장, 설명은 한국어로 작성합니다.
  - 슬라이드에 보이는 라벨·축·변수·관계를 객관적으로 서술합니다.
  - 필수인 경우에만 괄호 안에 원문(영어·기호)을 인용합니다.
  - 학술 논문 그림 설명 톤(대화체 금지).
  - "이 이미지는", "이 그림은", "이 슬라이드는", "도식은 ~을 보여준다"로 시작하지 않습니다.
  - 보이는 텍스트·기호·수식은 가능한 한 그대로 인용합니다.
  - 보이지 않는 제목·이름·숫자·세부를 추가하지 않습니다.
  - 제목 슬라이드·아이콘만·판독 불가인 경우 보이는 것만 간단히 적습니다.
